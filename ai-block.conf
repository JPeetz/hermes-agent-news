# Anti-scraping & AI protection — http-level config
# GEO policy (2026-10-28): ALLOW AI SEARCH browsers (ChatGPT, Perplexity, Claude)
# through; keep BLOCKING AI-training crawlers + scrapers + generic tools.
# This is the User-Agent 403 wall; robots.txt is the polite layer on top.

# Map user agents -> block decision
map $http_user_agent $blocked_agent {
    default               0;
    # ── AI TRAINING crawlers (blocked) ──
    ~*GPTBot              1;
    ~*CCBot               1;
    ~*Amazonbot           1;
    ~*anthropic-ai        1;
    ~*Bytespider          1;
    ~*cohere-ai           1;
    ~*Applebot-Extended   1;
    ~*Google-Extended     1;
    ~*Google-Extended-Cloud 1;
    ~*Google-CloudVertexBot 1;
    ~*Meta-ExternalAgent  1;
    # ── Scrapers / SEO crawlers / abusive tools (blocked) ──
    ~*FacebookBot         1;
    ~*omgili              1;
    ~*Diffbot             1;
    ~*ImagesiftBot        1;
    ~*magpie-crawler      1;
    ~*DataForSeoBot       1;
    ~*Scrapy              1;
    ~*SemrushBot          1;
    ~*AhrefsBot           1;
    ~*MJ12Bot             1;
    ~*Barkrowler          1;
    ~*BLEXBot             1;
    ~*TurnitinBot         1;
    ~*YandexBot           1;
    ~*YandexImages        1;
    ~*Baiduspider         1;
    ~*PetalBot            1;
    ~*AspiegelBot         1;
    ~*SeznamBot           1;
    ~*python-requests     1;
    ~*wget                1;
    ~*go-http-client      1;
}

# Map user agents -> crawler (GEO-serving) decision.
# These are the AI-search / search-engine crawlers we WANT to serve the
# SSI-baked GEO content (quick-answer + edition-seo) in raw HTML. Humans and
# everything else get the clean SPA shell (no text block above the banner).
# Keep this list intentionally narrow: only real crawlers that can't run JS.
map $http_user_agent $is_crawler {
    default                 0;
    ~*googlebot             1;
    ~*bingbot               1;
    ~*chatgpt               1;
    ~*gptbot                1;
    ~*perplexity            1;
    ~*claude                1;
    ~*anthropic             1;
    ~*slurp                 1;
    ~*duckduckbot           1;
    ~*applebot              1;
    ~*ia_archiver           1;
    ~*archive.org_bot       1;
    ~*facebookexternalhit   1;
    ~*twitterbot            1;
    ~*linkedinbot           1;
    ~*embedly               1;
    ~*quora-link-preview    1;
    ~*urlresolver           1;
    ~*screaming.?frog        1;
    ~*crawl                 1;
    ~*spider                1;
}

# Which SPA shell to serve, derived directly from the user agent.
# Crawlers get index.crawler.html (carries the GEO SSI includes); everyone else
# gets the clean index.html. Map directly on $http_user_agent (NOT on the
# $is_crawler map — chained map evaluation is unreliable in nginx: $spa_index
# resolved before $is_crawler was set, silently serving index.html to crawlers).
# Keep this list in sync with $is_crawler above.
map $http_user_agent $spa_index {
    default /index.html;
    ~*googlebot             /index.crawler.html;
    ~*bingbot               /index.crawler.html;
    ~*chatgpt               /index.crawler.html;
    ~*gptbot                /index.crawler.html;
    ~*perplexity            /index.crawler.html;
    ~*claude                /index.crawler.html;
    ~*anthropic             /index.crawler.html;
    ~*slurp                 /index.crawler.html;
    ~*duckduckbot           /index.crawler.html;
    ~*applebot              /index.crawler.html;
    ~*ia_archiver           /index.crawler.html;
    ~*archive.org_bot       /index.crawler.html;
    ~*facebookexternalhit   /index.crawler.html;
    ~*twitterbot            /index.crawler.html;
    ~*linkedinbot           /index.crawler.html;
    ~*embedly               /index.crawler.html;
    ~*quora-link-preview    /index.crawler.html;
    ~*urlresolver           /index.crawler.html;
    ~*screaming.?frog        /index.crawler.html;
    ~*crawl                 /index.crawler.html;
    ~*spider                /index.crawler.html;
}

# Rate limiting zones (must be at http level)
limit_req_zone $binary_remote_addr zone=main_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=2r/s;
