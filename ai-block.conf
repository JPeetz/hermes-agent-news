# Anti-scraping & AI protection — http-level config
# This file is loaded at the http{} level via /etc/nginx/conf.d/

# Map user agents -> block decision
map $http_user_agent $blocked_agent {
    default               0;
    ~*GPTBot              1;
    ~*GPT-User            1;
    ~*ClaudeBot           1;
    ~*Claude-Web          1;
    ~*CCBot               1;
    ~*Amazonbot           1;
    ~*anthropic-ai        1;
    ~*Bytespider          1;
    ~*OAI-SearchBot       1;
    ~*PerplexityBot       1;
    ~*cohere-ai           1;
    ~*Applebot-Extended   1;
    ~*Google-Extended     1;
    ~*Meta-ExternalAgent  1;
    ~*FacebookBot         1;
    ~*omgili              1;
    ~*Diffbot             1;
    ~*ImagesiftBot        1;
    ~*magpie-crawler      1;
    ~*DataForSeoBot       1;
    ~*Scrapy              1;
    ~*SemrushBot          1;
    ~*AhrefsBot           1;
    ~*MJ12Bot             1;
    ~*Barkrowler          1;
    ~*BLEXBot             1;
    ~*TurnitinBot         1;
    ~*YandexBot           1;
    ~*YandexImages        1;
    ~*Baiduspider         1;
    ~*PetalBot            1;
    ~*AspiegelBot         1;
    ~*SeznamBot           1;
    ~*python-requests     1;
    ~*curl                1;
    ~*wget                1;
    ~*go-http-client      1;
}

# Rate limiting zones (must be at http level)
limit_req_zone $binary_remote_addr zone=main_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=2r/s;