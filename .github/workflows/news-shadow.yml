              if ! try_sealed_bundle "$run_id" "$attempt_number" "$bundle_out"; then
                rm -rf "$bundle_out"
                if ! python3 scripts/shadow/import_legacy_bundle.py \
                  --source-repo "$SHADOW_SOURCE_REPOSITORY" \
                  --run-id "$run_id" \
                  --attempt "$attempt_number" \
                  --out "$bundle_out"; then
                  # Scheduled polling sees successful source runs that do not
                  # have a retained diagnostics/sealed artifact (for example
                  # a no-op or an expired run). Keep reconciling the next
                  # candidate; an explicit manual selector fails closed.
                  if [[ "${{ github.event_name }}" == "schedule" ]]; then
                    rm -rf "$bundle_out"
                    printf '%s\n' "{\"selector\":\"$selector\",\"status\":\"unavailable\"}" \
                      >> "$RUNNER_TEMP/news-shadow-metadata/selection-errors.jsonl"
                    continue
                  fi
                  exit 1
                fi
              fi
              if [[ -f "$bundle_out/manifest.json" ]]; then
                if [[ -n "$FROM_DATE" ]] && ! python3 - "$bundle_out/manifest.json" "$FROM_DATE" "$TO_DATE" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report_date = json.load(handle)["report_date"]
          raise SystemExit(0 if sys.argv[2] <= report_date <= sys.argv[3] else 1)
          PY
                then
                  rm -rf "$bundle_out"
                  continue
                fi
                if [[ "${{ github.event_name }}" == "schedule" ]] && ! python3 - "$bundle_out" "$SCHEDULE_POLICY_PATH" "$SCHEDULE_MODE" <<'PY'
          import sys
          from shadow.runtime import inspect_run
          try:
              inspect_run(sys.argv[1], sys.argv[2], mode=sys.argv[3], cohort="prospective")
          except (ValueError, OSError) as exc:
              print(f"Source bundle is not prospectively eligible: {type(exc).__name__}", file=sys.stderr)
              raise SystemExit(2)
          PY
                then
                  rm -rf "$bundle_out"
                  printf '%s\n' "{\"selector\":\"$selector\",\"status\":\"ineligible\"}" \
                    >> "$RUNNER_TEMP/news-shadow-metadata/selection-errors.jsonl"
                  continue
                fi
                bundle_count=$((bundle_count + 1))
                if [[ "${{ github.event_name }}" == "schedule" && "$bundle_count" -ge 2 ]]; then
                  break
                fi
              fi
            done
          else
            printf '%s\n' '{"status":"discovery_only","reason":"scheduled metadata discovery does not acquire or evaluate paid bundles"}' \
              > "$RUNNER_TEMP/news-shadow-metadata/selection-status.json"
          fi
          printf '%s\n' "evaluator_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'artifact_name=news-shadow-metadata' >> "$GITHUB_OUTPUT"

      - name: Upload metadata inventory
        uses: actions/upload-artifact@v4
        with:
          name: news-shadow-metadata
          path: ${{ runner.temp }}/news-shadow-metadata
          if-no-files-found: error
          retention-days: 90

  preflight:
    name: Owner-authorized model and bundle preflight
    if: >-
      github.repository == 'trend-ai-acceleration-task-force/ai-news-aggregator' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted evaluator commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preflight transport dependency
        run: python3 -m pip install --no-input "httpx>=0.27"
      - name: Run explicit model preflight
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SHADOW_INCUMBENT_API_KEY: ${{ secrets.SHADOW_INCUMBENT_API_KEY || secrets.RDSEC_API_KEY }}
          SHADOW_INCUMBENT_BASE_URL: ${{ secrets.SHADOW_INCUMBENT_BASE_URL || 'https://api.rdsec.trendmicro.com/prod/aiendpoint/v1' }}
          SHADOW_INCUMBENT_MODEL: ${{ secrets.SHADOW_INCUMBENT_MODEL }}
          RDSEC_API_KEY: ${{ secrets.RDSEC_API_KEY }}
          SHADOW_EVALUATOR_SHA: ${{ github.sha }}
          SHADOW_PREFLIGHT_POLICY_PATH: ${{ format('config/shadow/{0}.json', inputs.policy_version || 'news-relevance-v1-dev') }}
          SHADOW_PREFLIGHT_COHORT: ${{ inputs.cohort || 'engineering' }}
        run: |
          set -euo pipefail
          if [[ ! "$SHADOW_PREFLIGHT_POLICY_PATH" =~ ^config/shadow/[A-Za-z0-9_.-]+\.json$ ]]; then
            echo 'Policy path must be an allowlisted config/shadow JSON file.' >&2
            exit 2
          fi
          # The preflight owns its bounded synthetic request and writes a
          # structured status. It receives no production publishing secret.
          python3 scripts/shadow/preflight.py \
            --mode "${{ inputs.mode || 'filter' }}" \
            --cohort "$SHADOW_PREFLIGHT_COHORT" \
            --policy "$SHADOW_PREFLIGHT_POLICY_PATH" \
            --out "$RUNNER_TEMP/news-shadow-preflight.json" \
            --require-credentials \
            --probe-models
      - name: Upload preflight status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shadow-preflight
          path: ${{ runner.temp }}/news-shadow-preflight.json
          if-no-files-found: error
          retention-days: 90

  evaluator:
    name: Evaluate selected shadow bundle
    needs: metadata-acquisition
    if: >-
      github.repository == 'trend-ai-acceleration-task-force/ai-news-aggregator' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'evaluate') ||
       (github.event_name == 'schedule' && vars.NEWS_SHADOW_ENABLED == 'true' &&
        vars.NEWS_SHADOW_EVALUATE_ENABLED == 'true')) &&
      needs.metadata-acquisition.result == 'success'
    runs-on: ubuntu-latest
    # Two serial pipeline replays may each consume the reviewed 120-minute
    # text-replay ceiling. The coordinator still holds only one active lease.
    timeout-minutes: 250
    permissions:
      contents: read
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SHADOW_INCUMBENT_API_KEY: ${{ secrets.SHADOW_INCUMBENT_API_KEY || secrets.RDSEC_API_KEY }}
      SHADOW_INCUMBENT_BASE_URL: ${{ secrets.SHADOW_INCUMBENT_BASE_URL || 'https://api.rdsec.trendmicro.com/prod/aiendpoint/v1' }}
      SHADOW_INCUMBENT_MODEL: ${{ secrets.SHADOW_INCUMBENT_MODEL }}
      RDSEC_API_KEY: ${{ secrets.RDSEC_API_KEY }}
      SHADOW_EVALUATOR_SHA: ${{ github.sha }}
      SHADOW_RETRY_VERSION: ${{ inputs.retry_version || vars.NEWS_SHADOW_RETRY_VERSION || '1' }}
      SHADOW_CONTROL_REPEAT_POLICY: ${{ github.event_name == 'schedule' && 'sample20' || (inputs.repeat_control && 'always' || 'none') }}
      SHADOW_MODE: ${{ inputs.mode || vars.NEWS_SHADOW_MODE || 'filter' }}
      SHADOW_POLICY_VERSION: ${{ inputs.policy_version || vars.NEWS_SHADOW_POLICY_VERSION || 'scheduled-frozen' }}
      SHADOW_RUBRIC_VERSION: ${{ inputs.rubric_version || vars.NEWS_SHADOW_RUBRIC_VERSION || 'scheduled-frozen' }}
      SHADOW_COHORT: ${{ github.event_name == 'schedule' && 'prospective' || (inputs.cohort || 'engineering') }}
      SHADOW_POLICY_PATH: ${{ github.event_name == 'schedule' && (vars.NEWS_SHADOW_POLICY_PATH || 'config/shadow/news-relevance-v1-frozen.json') || format('config/shadow/{0}.json', inputs.policy_version || 'news-relevance-v1-dev') }}
    steps:
      - name: Check out trusted evaluator commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies for the isolated evaluator
        run: python3 -m pip install --no-input -r requirements.txt
      - name: Download source metadata inventory
        uses: actions/download-artifact@v4
        with:
          name: news-shadow-metadata
          path: ${{ runner.temp }}/news-shadow-metadata
      - name: Restore compact coordinator index
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/news-shadow-state"
          for state_file in index.json events.jsonl; do
            if [[ -f "$RUNNER_TEMP/news-shadow-metadata/discovery-state/$state_file" ]]; then
              cp "$RUNNER_TEMP/news-shadow-metadata/discovery-state/$state_file" \
                "$RUNNER_TEMP/news-shadow-state/$state_file"
            fi
          done
      - name: Validate selector and reserve bounded work
        env:
          SHADOW_SOURCE_RUNS: ${{ inputs.source_runs }}
          SHADOW_FROM_DATE: ${{ inputs.from_date }}
          SHADOW_TO_DATE: ${{ inputs.to_date }}
        run: |
          set -euo pipefail
          if [[ ! "$SHADOW_POLICY_PATH" =~ ^config/shadow/[A-Za-z0-9_.-]+\.json$ ]]; then
            echo 'Policy path must be an allowlisted config/shadow JSON file.' >&2
            exit 2
          fi
          python3 - "$SHADOW_POLICY_PATH" "$SHADOW_COHORT" <<'PY'
          import sys
          from shadow.settings import load_policy

          policy = load_policy(sys.argv[1])
          if sys.argv[2] in {"holdout", "prospective"} and policy.get("frozen") is not True:
              raise SystemExit("scheduled/holdout evaluation requires a frozen policy")
          PY
          python3 scripts/shadow/coordinate.py discover \
            --metadata "$RUNNER_TEMP/news-shadow-metadata/metadata.json" \
            --state-dir "$RUNNER_TEMP/news-shadow-state" \
            --source-runs "$SHADOW_SOURCE_RUNS" \
            --from-date "$SHADOW_FROM_DATE" \
            --to-date "$SHADOW_TO_DATE" \
            --mode "$SHADOW_MODE" \
            --policy-version "$SHADOW_POLICY_VERSION" \
            --rubric-version "$SHADOW_RUBRIC_VERSION" \
            --repeat-plan "$SHADOW_RETRY_VERSION:$SHADOW_CONTROL_REPEAT_POLICY" \
            --policy "$SHADOW_POLICY_PATH" \
            --evaluator-sha "$SHADOW_EVALUATOR_SHA" \
            --cohort "$SHADOW_COHORT" \
            --incumbent-route "$SHADOW_INCUMBENT_BASE_URL" \
            --incumbent-model "$SHADOW_INCUMBENT_MODEL" \
            --trusted-ref main \
            > "$RUNNER_TEMP/news-shadow-discovery.json"

      - name: Record sealed bundles and reserve bounded work
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/news-shadow-results" "$RUNNER_TEMP/news-shadow-records"
          manifests=("$RUNNER_TEMP/news-shadow-metadata"/bundles/*/manifest.json)
          if [[ ! -e "${manifests[0]}" ]]; then
            cp "$RUNNER_TEMP/news-shadow-metadata/selection-status.json" \
              "$RUNNER_TEMP/news-shadow-results/selection-status.json" 2>/dev/null || true
            printf '%s\n' '{"records":[],"reason":"no_eligible_acquired_bundle"}' > "$RUNNER_TEMP/news-shadow-claim.json"
            exit 0
          fi
          claim_args=()
          for manifest in "${manifests[@]}"; do
            record_path="$RUNNER_TEMP/news-shadow-records/$(basename "$(dirname "$manifest")").json"
            python3 scripts/shadow/coordinate.py record \
              --bundle "$(dirname "$manifest")" \
              --state-dir "$RUNNER_TEMP/news-shadow-state" \
              --mode "$SHADOW_MODE" \
              --policy-version "$SHADOW_POLICY_VERSION" \
              --rubric-version "$SHADOW_RUBRIC_VERSION" \
              --repeat-plan "$SHADOW_RETRY_VERSION:$SHADOW_CONTROL_REPEAT_POLICY" \
              --policy "$SHADOW_POLICY_PATH" \
              --evaluator-sha "$SHADOW_EVALUATOR_SHA" \
              --cohort "$SHADOW_COHORT" \
              --incumbent-route "$SHADOW_INCUMBENT_BASE_URL" \
              --incumbent-model "$SHADOW_INCUMBENT_MODEL" \
              --trusted-ref main \
              > "$record_path"
            experiment_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["experiment_id"])' "$record_path")"
            claim_args+=(--experiment-id "$experiment_id")
          done
          python3 scripts/shadow/coordinate.py claim \
            --state-dir "$RUNNER_TEMP/news-shadow-state" \
            --owner "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --lease-seconds 7500 \
            "${claim_args[@]}" \
            --limit 2 \
            > "$RUNNER_TEMP/news-shadow-claim.json"
      - name: Evaluate selected data-only bundles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/news-shadow-results"
          # The importer ran in the acquisition job with source-only access;
          # this job receives only sealed data bundles. It never checks out or
          # runs a production source ref, and each bundle gets an isolated
          # output directory.
          manifests=("$RUNNER_TEMP/news-shadow-metadata"/bundles/*/manifest.json)
          if [[ ! -e "${manifests[0]}" ]]; then
            if [[ -f "$RUNNER_TEMP/news-shadow-metadata/selection-status.json" ]]; then
              cp "$RUNNER_TEMP/news-shadow-metadata/selection-status.json" \
                "$RUNNER_TEMP/news-shadow-results/selection-status.json"
            fi
            exit 0
          fi
          process_claim() {
            local claim_file="$1"
            mapfile -t claimed_selectors < <(python3 - "$claim_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              value = json.load(handle)
          for row in value.get("records", []):
              source = row.get("source", {})
              run_id = source.get("run_id")
              attempt = source.get("attempt", 1)
              if isinstance(run_id, int) and isinstance(attempt, int):
                  print(f"{run_id}:{attempt}")
          PY
            )
            if [[ "${#claimed_selectors[@]}" -eq 0 ]]; then
              return 1
            fi
            for selector in "${claimed_selectors[@]}"; do
              bundle_name="${selector/:/-}"
              bundle_dir="$RUNNER_TEMP/news-shadow-metadata/bundles/$bundle_name"
              manifest="$bundle_dir/manifest.json"
              if [[ ! -f "$manifest" ]]; then
                echo "Claimed bundle is missing: $selector" >&2
                return 2
              fi
              result_dir="$RUNNER_TEMP/news-shadow-results/$bundle_name"
              result_path="$result_dir/run-result.json"
              mkdir -p "$result_dir"
              repeat_args=()
              if [[ "$SHADOW_CONTROL_REPEAT_POLICY" == 'always' ]] || \
                 { [[ "$SHADOW_CONTROL_REPEAT_POLICY" == 'sample20' ]] && python3 - "$manifest" <<'PY'
          import hashlib
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report_date = json.load(handle)["report_date"]
          raise SystemExit(0 if int(hashlib.sha256(report_date.encode()).hexdigest(), 16) % 5 == 0 else 1)
          PY
                 }; then
                repeat_args+=(--repeat-control)
              fi
              set +e
              python3 scripts/shadow/run.py \
                --bundle "$bundle_dir" \
                --out "$result_dir" \
                --mode "$SHADOW_MODE" \
                --policy "$SHADOW_POLICY_PATH" \
                --cohort "$SHADOW_COHORT" \
                --retry-version "$SHADOW_RETRY_VERSION" \
                "${repeat_args[@]}" \
                > "$result_path"
              run_rc=$?
              set -e
              result_id=""
              if [[ -s "$result_path" ]]; then
                result_id="$(python3 - "$result_path" <<'PY'
          import json
          import re
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  value = json.load(handle)
              candidate = value.get("experiment_id") if isinstance(value, dict) else None
              if isinstance(candidate, str) and re.fullmatch(r"[0-9a-f]{64}", candidate):
                  print(candidate)
          except (OSError, ValueError, TypeError):
              pass
          PY
                )"
              fi
              result_status=failed
              if [[ "$run_rc" -eq 0 ]]; then
                result_status=completed
              elif [[ "$run_rc" -eq 2 ]]; then
                result_status=incomplete
              fi
              # The completion event is part of the compact state artifact, so
              # a later poll cannot pay for a terminal identity again.
              python3 scripts/shadow/coordinate.py record \
                --bundle "$bundle_dir" \
                --state-dir "$RUNNER_TEMP/news-shadow-state" \
                --mode "$SHADOW_MODE" \
                --status "$result_status" \
                --policy-version "$SHADOW_POLICY_VERSION" \
                --rubric-version "$SHADOW_RUBRIC_VERSION" \
                --repeat-plan "$SHADOW_RETRY_VERSION:$SHADOW_CONTROL_REPEAT_POLICY" \
                --policy "$SHADOW_POLICY_PATH" \
                --evaluator-sha "$SHADOW_EVALUATOR_SHA" \
                --cohort "$SHADOW_COHORT" \
                --incumbent-route "$SHADOW_INCUMBENT_BASE_URL" \
                --incumbent-model "$SHADOW_INCUMBENT_MODEL" \
                --result-id "$result_id" \
                --result-path "$result_path" \
                --trusted-ref main \
                > "$RUNNER_TEMP/news-shadow-results/status-$bundle_name.json" || return 2
            done
            return 0
          }
          if process_claim "$RUNNER_TEMP/news-shadow-claim.json"; then
            :
          else
            claim_rc=$?
            if [[ "$claim_rc" -eq 1 ]]; then
              echo 'Coordinator produced no eligible acquired date.'
              exit 0
            fi
            exit "$claim_rc"
          fi
          # Claim and process one more date serially when the queue has two
          # eligible entries. The lease/state index is persisted by the writer;
          # a third date remains queued for the next invocation.
          claim_args=()
          for record_path in "$RUNNER_TEMP/news-shadow-records/"*.json; do
            experiment_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["experiment_id"])' "$record_path")"
            claim_args+=(--experiment-id "$experiment_id")
          done
          python3 scripts/shadow/coordinate.py claim \
            --state-dir "$RUNNER_TEMP/news-shadow-state" \
            --owner "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --lease-seconds 7500 \
            "${claim_args[@]}" \
            --limit 2 \
            > "$RUNNER_TEMP/news-shadow-claim-next.json"
          if process_claim "$RUNNER_TEMP/news-shadow-claim-next.json"; then
            :
          else
            claim_rc=$?
            [[ "$claim_rc" -eq 1 ]] || exit "$claim_rc"
          fi
      - name: Write structured evaluator status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/news-shadow-results"
          if [[ -d "$RUNNER_TEMP/news-shadow-state" && -f "$RUNNER_TEMP/news-shadow-state/index.json" ]]; then
            python3 scripts/shadow/coordinate.py list \
              --state-dir "$RUNNER_TEMP/news-shadow-state" \
              > "$RUNNER_TEMP/news-shadow-results/coordinator-status.json" || true
            mkdir -p "$RUNNER_TEMP/news-shadow-results/news-shadow-state"
            cp -R "$RUNNER_TEMP/news-shadow-state/." \
              "$RUNNER_TEMP/news-shadow-results/news-shadow-state/"
          fi
          if [[ ! -f "$RUNNER_TEMP/news-shadow-results/coordinator-status.json" ]]; then
            printf '%s\n' "{\"schema_version\":\"news-shadow-coordinate-status/v1\",\"status\":\"incomplete\",\"job_status\":\"$JOB_STATUS\",\"reason\":\"evaluator_step_failed\"}" \
              > "$RUNNER_TEMP/news-shadow-results/coordinator-status.json"
          fi
      - name: Upload evaluator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shadow-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/news-shadow-results
          if-no-files-found: error
          retention-days: 90
      - name: Publish assessment links in the CI summary
        if: always()
        env:
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "news-shadow-results"
          lines = ["## News relevance shadow", "",
                   f"[Detailed artifacts and assessments]({os.environ['ARTIFACT_URL']})", "",
                   "Production routing is unchanged; quality verdicts are judge-estimated.", ""]
          for path in sorted(root.glob("*/*/experiment.json")):
              try:
                  value = json.loads(path.read_text())
                  date = value.get("manifest", {}).get("report_date", "unknown")
                  lines.append(f"- {date}: **{value['status']}** — `{value['experiment_id'][:16]}` ({value['mode']})")
              except (OSError, ValueError, KeyError):
                  lines.append("- An experiment result could not be read; inspect the retained status artifact.")
          if not list(root.glob("*/*/experiment.json")):
              lines.append("No paid experiment result was produced. Inspect the coordinator status for eligibility or failure details.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

  # Only this job can write the internal results branch.  It never receives a
  # source token or model credential, and it writes manifests/statuses only.
  results-writer:
    name: Append shadow result index
    needs: [metadata-acquisition, evaluator]
    if: >-
      github.repository == 'trend-ai-acceleration-task-force/ai-news-aggregator' &&
      github.ref == 'refs/heads/main' &&
      always() && needs.metadata-acquisition.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'evaluate'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted evaluator commit without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # This is the only job with contents:write.  Keeping the job-local
          # checkout credential avoids putting a token in evaluator artifacts;
          # the evaluator job itself still uses persist-credentials:false.
          persist-credentials: true
      - name: Download evaluator artifacts
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'evaluate') ||
          (github.event_name == 'schedule' && vars.NEWS_SHADOW_EVALUATE_ENABLED == 'true')
        uses: actions/download-artifact@v4
        with:
          name: news-shadow-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/news-shadow-evaluation
      - name: Download scheduled discovery metadata
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/download-artifact@v4
        with:
          name: news-shadow-metadata
          path: ${{ runner.temp }}/news-shadow-discovery
      - name: Check out or initialize shadow-results branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/shadow-results >/dev/null 2>&1; then
            git fetch --no-tags origin shadow-results
            git checkout -B shadow-results FETCH_HEAD
          else
            git checkout --orphan shadow-results
            git rm -rf .
          fi
      - name: Append compact state with optimistic push retries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coordinator
          # Discovery is the base view; an evaluator result is the newer
          # optimistic state and must be applied last for scheduled runs.
          if [[ -d "$RUNNER_TEMP/news-shadow-discovery/discovery-state" ]]; then
            cp -R "$RUNNER_TEMP/news-shadow-discovery/discovery-state/." coordinator/
          fi
          if [[ -d "$RUNNER_TEMP/news-shadow-evaluation/news-shadow-state" ]]; then
            cp -R "$RUNNER_TEMP/news-shadow-evaluation/news-shadow-state/." coordinator/
          fi
          mkdir -p manifests
          if [[ -d "$RUNNER_TEMP/news-shadow-evaluation" ]]; then
            find "$RUNNER_TEMP/news-shadow-evaluation" -type f \
              \( -name 'identity.json' -o -name 'assessment.json' -o -name 'assessment.md' -o -name 'coordinator-status.json' \) \
              -exec cp --parents '{}' manifests/ \;
          fi
          if [[ -d "$RUNNER_TEMP/news-shadow-discovery" ]]; then
            find "$RUNNER_TEMP/news-shadow-discovery" -type f \
              \( -name 'discovery-result.json' -o -name 'selection-status.json' -o -name 'selection-errors.jsonl' \) \
              -exec cp --parents '{}' manifests/ \;
          fi
          printf '%s\n' '{"schema_version":"news-shadow-results/v1","source":"internal-workflow","auto_promotion":false}' \
            > "manifests/workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          git config user.name 'news-shadow-results-writer'
          git config user.email 'news-shadow-results@users.noreply.github.com'
          git add coordinator manifests
          git commit -m "Record news shadow run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" || true
          for attempt in 1 2 3; do
            echo "Optimistic results push attempt ${attempt}/3"
            if git push origin HEAD:shadow-results; then
              exit 0
            fi
            git fetch --no-tags origin shadow-results
            git rebase FETCH_HEAD
          done
          echo 'Unable to append shadow-results after three optimistic retries.' >&2
          exit 1
