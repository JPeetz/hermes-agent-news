name: News relevance shadow

# This workflow is deliberately absent from push/pull_request triggers.  A
# schedule only discovers metadata while NEWS_SHADOW_ENABLED is true. Paid
# scheduled evaluation additionally requires the separately opt-in
# NEWS_SHADOW_EVALUATE_ENABLED flag and a frozen policy; manual preflight and
# evaluation remain available through workflow_dispatch. It never publishes
# production data and never promotes the candidate filter.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - evaluate
      source_runs:
        description: "Source run IDs as run_id:attempt, comma/space separated"
        required: false
        type: string
      from_date:
        description: "Inclusive report date range start (YYYY-MM-DD)"
        required: false
        type: string
      to_date:
        description: "Inclusive report date range end (YYYY-MM-DD, max 14 dates)"
        required: false
        type: string
      mode:
        description: "Comparison capability"
        required: false
        default: filter
        type: choice
        options:
          - filter
          - pipeline
      cohort:
        description: "Predeclared evaluation cohort"
        required: false
        default: engineering
        type: choice
        options:
          - engineering
          - development
          - holdout
          - prospective
          - recovery
      policy_version:
        description: "Frozen candidate policy/cohort version"
        required: false
        default: news-relevance-v1-dev
        type: string
      rubric_version:
        description: "Frozen judge rubric version"
        required: false
        default: news-relevance-v1-dev
        type: string
      retry_version:
        description: "Explicit retry/version label; never silently reuses inference"
        required: false
        default: "1"
        type: string
      repeat_control:
        description: "Run an additional fresh incumbent control"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: news-shadow-coordinator
  cancel-in-progress: false

env:
  SHADOW_INTERNAL_REPOSITORY: trend-ai-acceleration-task-force/ai-news-aggregator
  SHADOW_SOURCE_REPOSITORY: flyryan/ai-news-aggregator
  SHADOW_SOURCE_WORKFLOW: .github/workflows/daily-pipeline.yml
  SHADOW_EVALUATOR_SHA: ${{ github.sha }}
  SHADOW_RETENTION_DAYS: "90"

jobs:
  # The guard is repeated at job level so a copied workflow cannot acquire
  # source or model credentials in a fork/mirror.  The trusted evaluator ref is
  # the checked-out workflow commit (github.sha), and the only accepted branch
  # is internal main.
  metadata-acquisition:
    name: Discover source runs and acquire metadata
    if: >-
      github.repository == 'trend-ai-acceleration-task-force/ai-news-aggregator' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.operation == 'evaluate')) &&
          (github.event_name == 'workflow_dispatch' || vars.NEWS_SHADOW_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      metadata_artifact: ${{ steps.meta.outputs.artifact_name }}
      selector_valid: ${{ steps.selector.outputs.valid }}
      evaluator_sha: ${{ steps.meta.outputs.evaluator_sha }}
    steps:
      - name: Check out trusted evaluator commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate bounded selector and trusted ref
        id: selector
        shell: bash
        env:
          SOURCE_RUNS: ${{ inputs.source_runs }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          SCHEDULE_EVAL_ENABLED: ${{ vars.NEWS_SHADOW_EVALUATE_ENABLED }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_RUNS" && ( -n "$FROM_DATE" || -n "$TO_DATE" ) && ( -z "$FROM_DATE" || -z "$TO_DATE" ) ]]; then
            echo 'from_date and to_date must be supplied together.' >&2
            exit 2
          fi
          if [[ -z "$SOURCE_RUNS" && -z "$FROM_DATE" && -z "$TO_DATE" && "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'evaluate requires source_runs or an explicit report-date range.' >&2
            exit 2
          fi
          # A process substitution stored in an array loses its file
          # descriptor before the later Python invocation. Use a real file.
          selector_metadata="$RUNNER_TEMP/news-shadow-selector-metadata.json"
          printf '%s\n' '{"runs": []}' > "$selector_metadata"
          selector_args=(discover --metadata "$selector_metadata"
            --state-dir "$RUNNER_TEMP/news-shadow-selector" --trusted-ref main)
          if [[ -n "$SOURCE_RUNS" ]]; then
            selector_args+=(--source-runs "$SOURCE_RUNS")
          fi
          if [[ -n "$FROM_DATE" ]]; then
            selector_args+=(--from-date "$FROM_DATE")
          fi
          if [[ -n "$TO_DATE" ]]; then
            selector_args+=(--to-date "$TO_DATE")
          fi
          # Parsing is performed by the dependency-free coordinator; this
          # check runs before any source artifact or model credential is used.
          python3 scripts/shadow/coordinate.py "${selector_args[@]}" >/dev/null
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Detect explicitly provisioned source token
        id: source-secret
        shell: bash
        env:
          NEWS_SHADOW_SOURCE_TOKEN: ${{ secrets.NEWS_SHADOW_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$NEWS_SHADOW_SOURCE_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a source-only GitHub App token when no protected token is configured
        id: source-app
        if: steps.source-secret.outputs.configured != 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: flyryan
          repositories: ai-news-aggregator
          permission-actions: read
          permission-contents: read

      - name: Acquire source run metadata only
        id: meta
        shell: bash
        env:
          # An explicitly provisioned protected token wins.  The App token is
          # minted above with actions:read + contents:read for this repository
          # only.  Neither credential reaches an evaluator or writer job.
          NEWS_SHADOW_SOURCE_TOKEN: ${{ secrets.NEWS_SHADOW_SOURCE_TOKEN }}
          SOURCE_APP_TOKEN: ${{ steps.source-app.outputs.token }}
          INTERNAL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUNS: ${{ inputs.source_runs }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          SCHEDULE_EVAL_ENABLED: ${{ vars.NEWS_SHADOW_EVALUATE_ENABLED }}
          SCHEDULE_POLICY_PATH: ${{ vars.NEWS_SHADOW_POLICY_PATH || 'config/shadow/news-relevance-v1-frozen.json' }}
          SCHEDULE_RETRY_VERSION: ${{ vars.NEWS_SHADOW_RETRY_VERSION || '1' }}
          SCHEDULE_MODE: ${{ vars.NEWS_SHADOW_MODE || 'filter' }}
          SCHEDULE_EVALUATOR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_token="$NEWS_SHADOW_SOURCE_TOKEN"
          if [[ -z "$source_token" ]]; then
            source_token="$SOURCE_APP_TOKEN"
          fi
          if [[ -z "$source_token" ]]; then
            echo 'No source artifact token available; existing app installation or protected token is required.' >&2
            exit 1
          fi
          # Keep the source-only token in this acquisition job's process
          # environment so the read-only importer can use the same scoped
          # identity. It is never exported as an artifact or job output.
          export GH_TOKEN="$source_token"
          mkdir -p "$RUNNER_TEMP/news-shadow-metadata"
          # Query the workflow-scoped endpoint and cap reconciliation to three
          # pages.  This prevents a 15-minute poll from walking unbounded
          # repository history; explicit attempts are still addressed below by
          # the run/attempt artifact endpoints.
          for page in 1 2 3; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/flyryan/ai-news-aggregator/actions/workflows/daily-pipeline.yml/runs?per_page=100&page=${page}" \
              > "$RUNNER_TEMP/news-shadow-metadata/source-runs-${page}.json"
          done
          python3 - "$RUNNER_TEMP/news-shadow-metadata" \
            > "$RUNNER_TEMP/news-shadow-metadata/source-runs.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          pages = []
          for path in sorted(root.glob("source-runs-[123].json")):
              with path.open(encoding="utf-8") as handle:
                  pages.append(json.load(handle))
          json.dump(pages, sys.stdout, separators=(",", ":"))
          sys.stdout.write("\n")
          PY
          cp "$RUNNER_TEMP/news-shadow-metadata/source-runs.json" "$RUNNER_TEMP/news-shadow-metadata/metadata.json"
          mkdir -p "$RUNNER_TEMP/news-shadow-metadata/discovery-state"
          # Carry forward only the compact internal index. The acquisition
          # job has contents:read on this repository; source credentials are
          # never used for this request.
          python3 - "$RUNNER_TEMP/news-shadow-metadata/discovery-state" <<'PY'
