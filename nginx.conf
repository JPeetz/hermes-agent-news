server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    root /app/web;
    index index.html;
    
    # Logging
    access_log /app/logs/nginx-access.log;
    error_log /app/logs/nginx-error.log;

    # ── Anti-scraping & AI protection layers ──────────────────────────────

    # Block known AI crawlers and scrapers by user-agent (double protection with robots.txt)
    map $http_user_agent $blocked_agent {
        default               0;
        ~*GPTBot              1;
        ~*GPT-User            1;
        ~*ClaudeBot           1;
        ~*Claude-Web          1;
        ~*CCBot               1;
        ~*Amazonbot           1;
        ~*anthropic-ai        1;
        ~*Bytespider          1;
        ~*OAI-SearchBot       1;
        ~*PerplexityBot       1;
        ~*cohere-ai           1;
        ~*Applebot-Extended   1;
        ~*Google-Extended     1;
        ~*Meta-ExternalAgent  1;
        ~*FacebookBot         1;
        ~*omgili              1;
        ~*Diffbot             1;
        ~*ImagesiftBot        1;
        ~*magpie-crawler      1;
        ~*DataForSeoBot       1;
        ~*Scrapy              1;
        ~*SemrushBot          1;
        ~*AhrefsBot           1;
        ~*MJ12Bot             1;
        ~*Barkrowler          1;
        ~*BLEXBot             1;
        ~*TurnitinBot         1;
        ~*YandexBot           1;
        ~*YandexImages        1;
        ~*Baiduspider         1;
        ~*PetalBot            1;
        ~*AspiegelBot         1;
        ~*SeznamBot           1;
        ~*python-requests     1;
        ~*curl                1;
        ~*wget                1;
        ~*go-http-client      1;
    }

    # Rate limiting zones: 10 req/s per IP for the main site, 2 req/s for API
    limit_req_zone $binary_remote_addr zone=main_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=2r/s;

    # Block AI/unknown agents
    if ($blocked_agent) {
        return 403;
    }

    # ── End anti-scraping ─────────────────────────────────────────────────
    
    # Newsletter subscribe API proxy to internal server
    location /api/subscribe {
        limit_req zone=api_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/subscribe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 1k;
        add_header Access-Control-Allow-Origin "https://hermesnews.xyz" always;
        # Honeypot: reject if hidden field is filled (bot behavior)
        if ($request_body ~* "website_url=.+" ) {
            return 403;
        }
    }

    # Kie.ai image generation callback webhook
    location /api/image-callback {
        proxy_pass http://127.0.0.1:8080/api/image-callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 10k;
    }

    # Main location - SPA routing with prerendered pages
    location / {
        limit_req zone=main_zone burst=20 nodelay;
        # Prevent AI training on content — opt-out headers for all AI crawlers
        add_header X-Robots-Tag "noai, noimageai, noindex, nofollow" always;
        add_header X-No-Archive "true" always;
        try_files $uri $uri/ $uri.html /index.html;
    }
    
    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Index and search files - always revalidate (changes with each update)
    location ~ ^/data/(index|search-index|search-documents)\.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Date-specific JSON data - revalidate every time.
    #
    # This was max-age=3600 on the theory that a day's data "rarely changes once
    # created". It does change: the pipeline rewrites today's files on each run, a
    # hero can be regenerated, and a correction to a published day is invisible for
    # up to an hour after deploy -- which is exactly how a fixed replay kept showing
    # stale failures.
    #
    # `no-cache` still lets the browser store the file; it just has to revalidate.
    # These responses carry an ETag, so an unchanged file costs one 304 with no
    # body rather than a re-download.
    location ~ "^/data/[0-9]+-[0-9]+-[0-9]+/.*\.(json|gz)$" {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Atom/RSS feeds
    location /data/feeds/ {
        types {
            application/atom+xml xml;
        }
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: script-src is governed by SvelteKit's build-time hash in the page <meta> tag
    # (frontend/svelte.config.js kit.csp). Do NOT add script-src or default-src here --
    # either would be enforced in addition to the meta policy and block the hashed inline
    # hydration script, producing a blank site. This header covers the non-script directives
    # plus frame-ancestors (which cannot live in a <meta> tag).
    add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
